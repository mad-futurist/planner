services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database owner password}
    ports: !reset []
    restart: unless-stopped
    mem_limit: 2g
  bootstrap:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set database owner password}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set a separate runtime password}
    volumes:
      - ./ops/bootstrap-runtime.sql:/bootstrap.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ['psql -h db -U planner -d planner -v ON_ERROR_STOP=1 -v runtime_password="$$RUNTIME_DB_PASSWORD" -f /bootstrap.sql']
    depends_on:
      db: {condition: service_healthy}
  migrate:
    env_file: ops/.env.production
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set owner database URL with encoded password}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
  api:
    env_file: ops/.env.production
    environment:
      APP_ENV: production
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set restricted runtime database URL}
    ports: !reset []
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips", "172.30.80.10", "--limit-concurrency", "16"]
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
    mem_limit: 2g
    cpus: 2
  worker:
    env_file: ops/.env.production
    environment:
      APP_ENV: production
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set restricted runtime database URL}
    mem_limit: 1g
    cpus: 2
  proxy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set public DNS hostname}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      default:
        ipv4_address: 172.30.80.10
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.80.0/24
volumes:
  caddy_data:
  caddy_config:
