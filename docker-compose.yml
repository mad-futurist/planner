services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
      POSTGRES_DB: planner
      PGCTLTIMEOUT: 120
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["planner_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      retries: 10
      start_period: 120s
  migrate:
    build: backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://planner:${POSTGRES_PASSWORD:-planner}@db:5432/planner
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://planner:${POSTGRES_PASSWORD:-planner}@db:5432/planner
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://planner:${POSTGRES_PASSWORD:-planner}@db:5432/planner
    command: ["uv", "run", "--no-sync", "python", "-m", "app.jobs.worker"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  planner_db:
